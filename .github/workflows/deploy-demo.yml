# Сборка демо-стенда и публикация на GitHub Pages.
#
# Почему не готовый withastro/action: нам нужно явно задать демо-режим
# (PUBLIC_DEMO=on), собрать шрифты из Fontsource до сборки сайта и прогнать
# проверки целостности. Явные шаги делают пайплайн читаемым и не зависят
# от того, как action угадает команду сборки.

name: Демо-стенд → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, необходимые для публикации на Pages (id-token для OIDC)
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные сборки одной ветки отменяют друг друга
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # Файлы шрифтов лежат в src/assets и обновляются из пакетов Fontsource.
      # Шаг воспроизводит их в CI, чтобы сборка не зависела от содержимого репозитория.
      - name: Синхронизировать шрифты
        run: node scripts/sync-fonts.mjs

      - name: Собрать демо-стенд
        run: npm run build:demo
        env:
          PUBLIC_DEMO: 'on'

      - name: Проверить языковые версии, ссылки и метатеги
        run: node scripts/check-i18n.mjs dist-demo /stasyclean/

      - name: Проверить бюджеты производительности
        run: node scripts/check-size.mjs dist-demo

      # Зеркальная проверка чистоты: в демо обязаны быть ВСЕ темы и панель.
      # Так стенд нельзя «починить» так, чтобы какая-то тема из него пропала.
      - name: Проверить полноту демо-стенда
        run: node scripts/check-clean.mjs dist-demo

      # Контраст палитр: агностик к сборке, но стоит в CI рядом с остальными
      # проверками, потому что палитры меняются куда чаще, чем вёрстка.
      - name: Проверить контраст тем и палитр
        run: npm run check:colors

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Загрузить артефакт сборки
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
