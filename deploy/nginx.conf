# Конфигурация nginx для прод-сборки StasyClean.
#
# Сайт полностью статический: nginx только отдаёт файлы, ни Node,
# ни PHP на сервере не нужны. Достаточно скопировать содержимое dist/
# в /var/www/stasyclean и подключить этот конфиг.
#
# Проверка перед перезагрузкой:
#   nginx -t && systemctl reload nginx

# http → https, без www
server {
    listen 80;
    listen [::]:80;
    server_name stasyclean.com www.stasyclean.com;

    # ACME-челлендж Let's Encrypt должен проходить по http
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://stasyclean.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.stasyclean.com;

    ssl_certificate     /etc/letsencrypt/live/stasyclean.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stasyclean.com/privkey.pem;

    return 301 https://stasyclean.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name stasyclean.com;

    root /var/www/stasyclean;
    index index.html;

    # ---------- TLS ----------
    ssl_certificate     /etc/letsencrypt/live/stasyclean.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stasyclean.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- Сжатие ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Brotli даёт ещё ~15% на HTML/CSS. Если модуль установлен —
    # раскомментируйте блок; если нет, строки ниже nginx не примет.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- Кеширование ----------
    # Ассеты с хешем содержимого в имени можно кешировать навсегда:
    # при изменении файла меняется и имя.
    location /_a/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /manifest.webmanifest {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---------- Основные страницы ----------
    # HTML не кешируем: контент и цены меняются, а размер страницы мал.
    location / {
        # Каноническая форма адреса — со слэшем в конце (Astro собирает
        # страницы в каталоги с index.html).
        try_files $uri $uri/index.html $uri/ =404;

        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        access_log off;
    }

    # ---------- Заголовки безопасности ----------
    # Сайт не подключает сторонние скрипты, поэтому CSP закрыта почти
    # полностью: только свои ресурсы и инлайновые стили/скрипты Astro.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;

    # ---------- Редиректы со старых адресов ----------
    # На прежней версии сайта URL были кириллицей и percent-encoded.
    # Сохраняем ссылочный вес и не ломаем ссылки из Telegram-переписок.
    # В nginx нужно указывать percent-encoded форму.
    location = /%D0%B3%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F {
        return 301 https://stasyclean.com/ru/;
    }

    location = /%D1%86%D0%B5%D0%BD%D1%8B {
        return 301 https://stasyclean.com/ru/ceny/;
    }

    location = /%D0%B3%D0%B5%D0%BD%D0%B5%D1%80%D0%B0%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F-%D1%83%D0%B1%D0%BE%D1%80%D0%BA%D0%B0 {
        return 301 https://stasyclean.com/ru/uslugi/generalnaya-uborka/;
    }

    location = /%D0%BF%D0%BE%D0%B4%D0%B4%D0%B5%D1%80%D0%B6%D0%B8%D0%B2%D0%B0%D1%8E%D1%89%D0%B0%D1%8F-%D1%83%D0%B1%D0%BE%D1%80%D0%BA%D0%B0 {
        return 301 https://stasyclean.com/ru/uslugi/podderzhivayushchaya-uborka/;
    }

    # ---------- Служебное ----------
    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    # Не отдавать скрытые файлы
    location ~ /\. {
        deny all;
    }

    # Отключаем логи для статики, чтобы не засорять диск
    location ~* \.(woff2|svg|png|jpg|jpeg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
}
